<!DOCTYPE html>
<html>
<head>
  <title>Collaborative Code Editor Test</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body{
      font-family: Arial;
      margin:20px;
      background:#f4f4f4;
    }

    textarea{
      width:100%;
      height:200px;
      margin-top:10px;
    }

    #chat{
      height:150px;
      overflow-y:auto;
      border:1px solid #ccc;
      padding:10px;
      background:white;
    }

    #users{
      border:1px solid #ccc;
      padding:10px;
      background:white;
    }

    input,button,select{
      margin:5px;
      padding:6px;
    }

    #output {
      background: #282c34;
      color: #abb2bf;
      padding: 15px;
      border-radius: 5px;
      min-height: 50px;
      white-space: pre-wrap;
      font-family: 'Courier New', Courier, monospace;
      margin-top: 10px;
    }
  </style>

</head>

<body>

<div id="auth-section">
  <h3>1. Authentication</h3>
  <input id="email" placeholder="Email">
  <input id="login-password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="auth-status" style="color: blue;"></p>
</div>

<hr>

<h3>2. Join Room</h3>
<label>Username</label>
<input id="username" placeholder="username">

<label>Room ID</label>
<input id="roomId" placeholder="6 digit room">

<label>Password (Optional)</label>
<input id="password" type="password" placeholder="room password">

<button onclick="joinRoom()">Join Room</button>

<hr>


<h3>Language</h3>
<select id="language" onchange="changeLanguage()">
<option value="javascript">JavaScript</option>
<option value="python">Python</option>
<option value="cpp">C++</option>
<option value="java">Java</option>
</select>

<h3>3. Editor</h3>
<textarea id="code"></textarea>
<button onclick="runCode()" style="background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer;">Execute Code (JDoodle)</button>

<h4>Output:</h4>
<div id="output">Execution results will appear here...</div>


<h3>Users in Room</h3>
<div id="users"></div>

<h3>Chat</h3>
<div id="chat"></div>

<input id="message" placeholder="type message">
<button onclick="sendMessage()">Send</button>

<script>

const socket = io("http://localhost:5000");

let roomId="";
let username="";

socket.on("connect",()=>{
  console.log("Connected:",socket.id);
});

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("login-password").value;
  const status = document.getElementById("auth-status");

  try {
    const response = await fetch("http://localhost:5000/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await response.json();
    if (response.ok) {
      status.innerText = "Logged in as " + data.user.username;
      localStorage.setItem("token", data.token);
      document.getElementById("username").value = data.user.username;
    } else {
      status.innerText = "Login failed: " + data.message;
    }
  } catch (err) {
    status.innerText = "Error: " + err.message;
  }
}

function joinRoom(){


  username=document.getElementById("username").value;
  roomId=document.getElementById("roomId").value;
  const password=document.getElementById("password").value;

  socket.emit("join-room",{
    roomId:roomId,
    username:username,
    password:password
  });

}


socket.on("load-code",(data)=>{
  document.getElementById("code").value=data.code;
  document.getElementById("language").value=data.language;
});

socket.on("load-messages",(messages)=>{

  const chat=document.getElementById("chat");
  chat.innerHTML="";

  messages.forEach(m=>{
    chat.innerHTML+=`<p><b>${m.sender}</b>: ${m.message}</p>`;
  });

});

socket.on("room-info",(info)=>{
  console.log("Room Info:",info);
});

socket.on("room-users",(users)=>{

  const div=document.getElementById("users");
  div.innerHTML="";

  users.forEach(u=>{
    div.innerHTML+=`<p>${u}</p>`;
  });

});

socket.on("user-joined",(data)=>{
  addChat(` ${data.username} joined`);
});

socket.on("user-left",(data)=>{
  addChat(` ${data.username} left`);
});

socket.on("receive-message",(msg)=>{
  addChat(`<b>${msg.sender}</b>: ${msg.message}`);
});

socket.on("code-update",(code)=>{
  document.getElementById("code").value=code;
});

socket.on("language-update",(language)=>{
  document.getElementById("language").value=language;
});

socket.on("cursor-update",(data)=>{
  console.log("Cursor moved by",data.username,data.cursor);
});

socket.on("error",(err)=>{
  alert(err.message);
});

document.getElementById("code").addEventListener("input",function(){

  socket.emit("code-change",{
    roomId:roomId,
    code:this.value
  });

});

function changeLanguage(){

  const language=document.getElementById("language").value;

  socket.emit("language-change",{
    roomId:roomId,
    language:language
  });

}

function sendMessage(){

  const msg=document.getElementById("message").value;

  socket.emit("send-message",{
    roomId:roomId,
    username:username,
    message:msg
  });

  document.getElementById("message").value="";

}

async function runCode() {
  const code = document.getElementById("code").value;
  const language = document.getElementById("language").value;
  const outputDiv = document.getElementById("output");
  const token = localStorage.getItem("token");

  outputDiv.innerText = "Running code...";

  try {
    const response = await fetch("http://localhost:5000/api/execute", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ code, language })
    });

    const data = await response.json();
    outputDiv.innerText = data.output || "No output returned.";
    if (data.cpuTime) {
      outputDiv.innerText += `\n\n[CPU Time: ${data.cpuTime}s, Memory: ${data.memory}KB]`;
    }
  } catch (err) {
    outputDiv.innerText = "Error: " + err.message;
  }
}


function addChat(msg){

  const chat=document.getElementById("chat");

  chat.innerHTML+=`<p>${msg}</p>`;

  chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
